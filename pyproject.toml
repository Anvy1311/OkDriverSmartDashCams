[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/adapters.py" = ["E501"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
